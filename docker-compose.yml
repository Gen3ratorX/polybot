services:
  polybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybot
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////data/bot.db
      PYTHONUNBUFFERED: "1"
      STRATEGY_SECTION: ${STRATEGY_SECTION:-late_market_edge}
      REQUESTED_BUDGET_USDC: ${REQUESTED_BUDGET_USDC:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - polybot-data:/data
    command: ["python", "scripts/run_daemon.py", "--cycles", "0", "--submit"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -u 10001 -f 'scripts/run_daemon.py' >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  telegram-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-router
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////data/bot.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - polybot-data:/data
    command: ["python", "scripts/run_telegram_router.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -u 10001 -f 'scripts/run_telegram_router.py' >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybot-web
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////data/bot.db
      PYTHONUNBUFFERED: "1"
    ports:
      - "5999:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - polybot-data:/data
    command: ["python", "scripts/run_web.py"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -u 10001 -f 'scripts/run_web.py' >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  polybot-data:
