services:
  polybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybot
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////data/bot.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - polybot-data:/data
    command: ["python", "scripts/run_daemon.py", "--cycles", "0", "--submit"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -u 10001 -f 'scripts/run_daemon.py' >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  polybot-data:
